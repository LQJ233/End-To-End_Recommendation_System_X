global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spring-boot-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: rec-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
